name: 大盤重挫日自動疊圖

on:
  schedule:
    # 10:00 UTC = 台北時間 18:00，避開收盤資料尚未完整更新的時段
    - cron: "0 10 * * 1-5"
  workflow_dispatch: {}   # 允許在 GitHub Actions 頁面手動觸發，方便測試

permissions:
  contents: write

concurrency:
  group: crash-day-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run crash-day pipeline
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/crash_day_pipeline.py

      - name: Commit and push if changed
        run: |
          git config user.name "crash-day-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json pictures
          if git diff --cached --quiet; then
            echo "沒有新資料，不需要 commit。"
          else
            TODAY=$(TZ=Asia/Taipei date +%F)
            git commit -m "大盤重挫日：新增 ${TODAY}"
            git push
          fi
