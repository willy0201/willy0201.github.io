name: 大盤重挫日自動疊圖

on:
  schedule:
    # GitHub 排程在整點最壅塞，常延遲好幾個小時(曾經延到隔天凌晨)，所以避開
    # 整點、一晚排多次。流程本身會檢查最近幾個交易日還沒處理的重挫日，
    # 晚跑或重複跑都不會漏、也不會重複處理。
    - cron: "17 10 * * 1-5"   # 台北 18:17
    - cron: "47 11 * * 1-5"   # 台北 19:47
    - cron: "17 14 * * 1-5"   # 台北 22:17
    - cron: "37 0 * * 2-6"    # 台北隔天 08:37（開盤前最後補跑）
  workflow_dispatch: {}   # 允許在 GitHub Actions 頁面手動觸發，方便測試

permissions:
  contents: write
  issues: write

concurrency:
  group: crash-day-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run crash-day pipeline
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/crash_day_pipeline.py

      # 每個交易日都更新「近一年股價」圖用的收盤價(不只重挫日)；失敗時仍會
      # commit 上一步的重挫日資料，並在最後開失敗 issue
      - name: Update one-year price data
        id: trend
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/trend_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "crash-day-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json pictures prices
          if git diff --cached --quiet; then
            echo "沒有新資料，不需要 commit。"
          else
            # 用資料本身的日期，而不是排程實際執行的日期(延遲時會差一天)
            if git diff --cached --quiet -- data.json; then
              LATEST=$(python -c "import glob,json; print(max(json.load(open(f))['dates'][-1] for f in glob.glob('prices/*.json')))")
              git commit -m "近一年股價：更新 ${LATEST}"
            else
              ADDED=$(git diff --cached --name-only -- pictures | cut -d/ -f2 | sort -u | paste -sd'、')
              git commit -m "大盤重挫日：新增 ${ADDED:-資料更新}"
            fi
            git push
          fi

      - name: Create or update failure issue
        if: failure() || steps.trend.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "每日股價更新失敗";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `執行時間：${new Date().toISOString()}`,
              `觸發方式：${context.eventName}`,
              `失敗紀錄：${runUrl}`,
              "請開啟失敗紀錄查看原因；修正後可在 Actions 頁面手動重新執行。"
            ].join("\n\n");
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = data.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
