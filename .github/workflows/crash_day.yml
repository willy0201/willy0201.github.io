name: 大盤重挫日自動疊圖

on:
  schedule:
    # 10:00 UTC = 台北時間 18:00，避開收盤資料尚未完整更新的時段
    - cron: "0 10 * * 1-5"
    # 11:00 UTC = 台北時間 19:00；18:00 已完整完成時會直接結束，否則補跑
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {}   # 允許在 GitHub Actions 頁面手動觸發，方便測試

permissions:
  contents: write
  issues: write

concurrency:
  group: crash-day-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run crash-day pipeline
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/crash_day_pipeline.py

      # 每個交易日都更新「近一年股價」圖用的收盤價(不只重挫日)；失敗時仍會
      # commit 上一步的重挫日資料，並在最後開失敗 issue
      - name: Update one-year price data
        id: trend
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/trend_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "crash-day-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json pictures prices
          if git diff --cached --quiet; then
            echo "沒有新資料，不需要 commit。"
          else
            TODAY=$(TZ=Asia/Taipei date +%F)
            if git diff --cached --quiet -- data.json; then
              git commit -m "近一年股價：更新 ${TODAY}"
            else
              git commit -m "大盤重挫日：新增 ${TODAY}"
            fi
            git push
          fi

      - name: Create or update failure issue
        if: failure() || steps.trend.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "每日股價更新失敗";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `執行時間：${new Date().toISOString()}`,
              `觸發方式：${context.eventName}`,
              `失敗紀錄：${runUrl}`,
              "請開啟失敗紀錄查看原因；修正後可在 Actions 頁面手動重新執行。"
            ].join("\n\n");
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = data.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
