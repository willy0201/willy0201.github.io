<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>逆勢日誌</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-70EKPXQTBG"></script>

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f2ea;
    --surface:#ffffff;
    --surface-2:#ede8db;
    --rail-bg:#efeadd;
    --text:#201d17;
    --text-muted:#726a5a;
    --border:#ddd6c4;
    --accent:#a8672b;
    --accent-soft:#f1e3cf;
    --accent-ink:#ffffff;
    --up:#c0392b;
    --up-soft:#f7dedb;
    --down:#2f7d5a;
    --down-soft:#dbeee3;
    --chart-mat:#f7f5ef;
    --shadow: 0 1px 2px rgba(30,24,10,.06), 0 8px 24px -12px rgba(30,24,10,.18);
    --focus: #7a4a1c;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14171b;
      --surface:#1b1f25;
      --surface-2:#20242b;
      --rail-bg:#1a1e24;
      --text:#eae6db;
      --text-muted:#9a9284;
      --border:#2c313a;
      --accent:#d9a35f;
      --accent-soft:#3a2f1e;
      --accent-ink:#1b1408;
      --up:#e2685a;
      --up-soft:#3a201d;
      --down:#59b98b;
      --down-soft:#1c322a;
      --chart-mat:#f2efe6;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.6);
      --focus: #e8bd82;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14171b;
    --surface:#1b1f25;
    --surface-2:#20242b;
    --rail-bg:#1a1e24;
    --text:#eae6db;
    --text-muted:#9a9284;
    --border:#2c313a;
    --accent:#d9a35f;
    --accent-soft:#3a2f1e;
    --accent-ink:#1b1408;
    --up:#e2685a;
    --up-soft:#3a201d;
    --down:#59b98b;
    --down-soft:#1c322a;
    --chart-mat:#f2efe6;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.6);
    --focus: #e8bd82;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans TC','Noto Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{ background:var(--accent-soft); color:var(--text); }
  a{ color:inherit; }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

  .num{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }

  /* ---------- layout ---------- */
  .layout{
    max-width:1280px; margin:0 auto;
    display:grid;
    grid-template-columns:280px 1fr;
    align-items:start;
  }
  @media (max-width:860px){
    .layout{ grid-template-columns:1fr; }
  }

  /* ---------- rail ---------- */
  nav.rail{
    background:var(--rail-bg);
    border-right:1px solid var(--border);
    position:sticky; top:0;
    height:100vh;
    overflow-y:auto;
    padding:6px 0 40px;
  }
  @media (max-width:860px){
    nav.rail{
      position:static; height:auto; max-height:200px;
      border-right:none; border-bottom:1px solid var(--border);
    }
  }
  .year-group + .year-group{ margin-top:2px; }
  .year-label{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    width:100%; border:0; background:var(--rail-bg); cursor:pointer;
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:14px;
    padding:14px 20px 6px; color:var(--text-muted);
    position:sticky; top:0;
  }
  .year-label:hover{ color:var(--text); }
  .year-label .chevron{
    flex:none; transition:transform .15s ease;
  }
  .year-group.collapsed .year-label .chevron{ transform:rotate(-90deg); }
  .year-group.collapsed .day-list{ display:none; }
  ul.day-list{ list-style:none; margin:0; padding:0; }
  .day-row{
    display:flex; align-items:center; gap:10px;
    width:100%; text-align:left;
    padding:8px 20px; border:0; background:transparent; cursor:pointer;
    color:var(--text); font-size:13.5px;
    border-left:3px solid transparent;
  }
  .day-row:hover{ background:var(--surface-2); }
  .day-row[aria-current="true"]{
    background:var(--surface);
    border-left-color:var(--accent);
    font-weight:600;
  }
  .day-row .d{ font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; }
  .day-row .n{
    margin-left:auto; font-family:'IBM Plex Mono',monospace;
    font-size:11.5px; color:var(--text-muted);
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:20px; padding:1px 8px;
  }
  .day-row[aria-current="true"] .n{ color:var(--accent); border-color:var(--accent-soft); }
  .day-row .has-dot{ width:3px; height:14px; border-radius:2px; background:var(--up); flex:none; }
  .day-row .no-dot{ width:3px; height:14px; flex:none; }

  /* ---------- main ---------- */
  main{ padding:28px 24px 80px; min-width:0; }

  .detail-head{
    display:flex; flex-wrap:wrap; gap:24px 40px; align-items:flex-end;
    padding-bottom:20px; border-bottom:1px solid var(--border); margin-bottom:26px;
  }
  .detail-date{
    font-family:'Noto Serif TC',serif; font-weight:900; font-size:clamp(28px,4vw,40px);
    text-wrap:balance; line-height:1.1;
  }
  .detail-date .weekday{
    font-family:'Noto Sans TC',sans-serif; font-weight:500; font-size:15px;
    color:var(--text-muted); margin-left:10px;
  }
  .stat{
    display:flex; flex-direction:column; gap:2px;
  }
  .stat .label{ font-size:11.5px; color:var(--text-muted); letter-spacing:.04em; }
  .stat .value{ font-size:20px; font-weight:600; }
  .stat .value.down{ color:var(--down); }
  .badge{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12.5px; font-weight:600; padding:5px 12px; border-radius:20px;
    border:1px solid var(--down-soft); background:var(--down-soft); color:var(--down);
    white-space:nowrap;
  }
  .badge svg{ width:11px; height:11px; }
  .found-count{
    font-size:14px; color:var(--text-muted); margin-left:auto;
  }
  .found-count b{ color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:18px; }

  /* ---------- stock grid ---------- */
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(min(460px,100%),1fr));
    gap:26px;
  }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    overflow:hidden; box-shadow:var(--shadow);
    display:flex; flex-direction:column;
  }
  .card .frame{
    background:var(--chart-mat); padding:14px 14px 6px;
    cursor:zoom-in;
  }
  .card .frame img{ display:block; width:100%; height:auto; border-radius:2px; }
  .card .meta{
    padding:12px 16px 16px; display:flex; align-items:center; gap:10px;
  }
  .card .ticker{
    font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--accent);
    background:var(--accent-soft); border-radius:5px; padding:2px 7px; font-weight:600;
  }
  .card .name{ font-weight:700; font-size:16px; }

  /* empty state cards (no chart synced yet) */
  .grid.pending{ grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); }
  .pending-card{
    border:1px dashed var(--border); border-radius:10px; padding:16px;
    display:flex; flex-direction:column; gap:6px; background:var(--surface);
  }
  .pending-card .ph-ticker{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-muted); }
  .pending-note{
    grid-column:1/-1;
    border:1px dashed var(--border); border-radius:10px; padding:22px;
    color:var(--text-muted); font-size:13.5px; text-align:center; background:var(--surface);
  }
  .pending-note strong{ color:var(--text); }

  /* ---------- lightbox ---------- */
  dialog.lightbox{
    border:0; padding:0; background:transparent; max-width:min(92vw,1000px); width:100%;
  }
  dialog.lightbox::backdrop{ background:rgba(10,8,4,.72); }
  .lightbox-inner{
    background:var(--chart-mat); border-radius:12px; padding:20px 20px 16px; position:relative;
  }
  .lightbox-inner img{ width:100%; height:auto; border-radius:4px; display:block; }
  .lightbox-close{
    position:absolute; top:-14px; right:-14px; width:32px; height:32px; border-radius:50%;
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow);
  }
  .lightbox-caption{ margin-top:10px; font-size:13px; color:#4a4335; text-align:center; }

  footer{
    max-width:1280px; margin:0 auto; padding:20px 24px 48px;
    border-top:1px solid var(--border); font-size:12.5px; color:var(--text-muted);
    display:flex; flex-wrap:wrap; gap:8px 24px;
  }
  footer a{ color:var(--accent); text-decoration:none; }
  footer a:hover{ text-decoration:underline; }

  .load-state{
    padding:60px 24px; text-align:center; color:var(--text-muted); font-size:14px;
    grid-column:1/-1;
  }

  @media (prefers-reduced-motion:no-preference){
    .card{ transition:transform .15s ease, box-shadow .15s ease; }
    .card:hover{ transform:translateY(-2px); }
  }
</style>
</head>
<body>

<div class="layout">
  <nav class="rail" id="rail" aria-label="重挫日清單"></nav>
  <main id="main"><div class="load-state">載入中…</div></main>
</div>

<footer>
  <span>資料整理：<strong>willy 的做功課筆記</strong></span>
  <span>大盤重挫日與逆勢股名單來源：<a href="https://concords.moneydj.com/z/zk/zk1/zkparse_580_30.djhtm" target="_blank" rel="noopener">MoneyDJ 個股資訊</a></span>
  <span>股價資料來源：<a href="https://finmindtrade.com/" target="_blank" rel="noopener">FinMind</a></span>
  <span>台股慣例：紅漲、綠跌</span>
  <span>每日排程自動更新</span>
</footer>

<dialog class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <button class="lightbox-close" id="lightboxClose" aria-label="關閉">✕</button>
    <img id="lightboxImg" src="" alt="">
    <p class="lightbox-caption" id="lightboxCaption"></p>
  </div>
</dialog>

<script>
let DATA = [];

const downIcon = '<svg viewBox="0 0 10 10" fill="none"><path d="M5 9V1M5 9l3.5-3.5M5 9L1.5 5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function weekdayZh(dateStr){
  const days = ['日','一','二','三','四','五','六'];
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  return '星期' + days[dt.getUTCDay()];
}

function fmtDate(dateStr){
  const [y,m,d] = dateStr.split('-');
  return {y, md: `${parseInt(m)}/${parseInt(d)}`, full: `${y}.${m}.${d}`};
}

const collapsedYears = new Set();
let collapsedInitialized = false;

function buildRail(selected){
  const byYear = {};
  DATA.forEach(e=>{
    const y = e.date.slice(0,4);
    (byYear[y] = byYear[y] || []).push(e);
  });
  const years = Object.keys(byYear).sort((a,b)=>b-a);

  // 第一次畫的時候，預設只展開「目前選中日期」所在的年份，其他年份先收合
  // (之後使用者自己點年份標題展開/收合，這裡就不會再介入)
  if (!collapsedInitialized){
    const currentYear = selected ? selected.slice(0,4) : years[0];
    years.forEach(y=>{ if (y !== currentYear) collapsedYears.add(y); });
    collapsedInitialized = true;
  }

  const rail = document.getElementById('rail');
  rail.innerHTML = years.map(y => {
    const isCollapsed = collapsedYears.has(y);
    return `
    <div class="year-group${isCollapsed ? ' collapsed' : ''}">
      <button class="year-label" type="button" data-year="${y}" aria-expanded="${!isCollapsed}">
        <span>${y}</span>
        <svg class="chevron" viewBox="0 0 10 10" width="10" height="10" fill="none" aria-hidden="true">
          <path d="M2 3l3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <ul class="day-list">
        ${byYear[y].map(e => {
          const f = fmtDate(e.date);
          const current = e.date === selected;
          const dotCls = e.stocks.length ? 'has-dot' : 'no-dot';
          return `<li>
            <button class="day-row" data-date="${e.date}" aria-current="${current}">
              <span class="${dotCls}"></span>
              <span class="d">${f.md}</span>
              <span class="n">${e.count}檔</span>
            </button>
          </li>`;
        }).join('')}
      </ul>
    </div>
  `;
  }).join('');

  rail.querySelectorAll('.day-row').forEach(btn=>{
    btn.addEventListener('click', ()=> selectDate(btn.dataset.date));
  });

  rail.querySelectorAll('.year-label').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const y = btn.dataset.year;
      if (collapsedYears.has(y)) collapsedYears.delete(y);
      else collapsedYears.add(y);
      buildRail(currentDate);
    });
  });
}

function renderDetail(entry){
  const f = fmtDate(entry.date);
  const main = document.getElementById('main');

  let statsHtml = '';
  if (entry.close != null){
    statsHtml = `
      <div class="stat">
        <span class="label">大盤收盤</span>
        <span class="value num">${entry.close.toLocaleString('zh-TW',{minimumFractionDigits:2})}</span>
      </div>
      <div class="stat">
        <span class="label">當日跌點</span>
        <span class="value down num">▼ ${entry.dropPts.toLocaleString('zh-TW',{minimumFractionDigits:2})}</span>
      </div>
      <div class="badge">${downIcon} 重挫 ${entry.dropPct.toFixed(2)}%</div>
    `;
  } else {
    statsHtml = `
      <div class="stat">
        <span class="label">大盤當日狀態</span>
        <span class="value">重挫 ≥ 1.5%（歷史資料，精確跌幅尚未核對）</span>
      </div>
    `;
  }

  let bodyHtml = '';
  if (entry.stocks.length){
    bodyHtml = `<div class="grid">` + entry.stocks.map((s,i) => `
      <figure class="card">
        <a class="frame" data-idx="${i}" href="#" aria-label="放大檢視 ${s.name} 疊圖">
          <img src="${s.img}" alt="${s.code} ${s.name} 近三年股價與大盤疊圖" loading="lazy">
        </a>
        <figcaption class="meta">
          <span class="ticker">${s.code}</span>
          <span class="name">${s.name}</span>
        </figcaption>
      </figure>
    `).join('') + `</div>`;
  } else {
    bodyHtml = `<div class="grid pending">` +
      Array.from({length: Math.min(entry.count, 12)}).map(()=>`
        <div class="pending-card">
          <span class="ph-ticker">— 圖表待同步 —</span>
        </div>`).join('') +
      `<div class="pending-note">這天篩到 <strong>${entry.count}</strong> 檔逆勢股，圖表尚未產生。</div>` +
      `</div>`;
  }

  main.innerHTML = `
    <div class="detail-head">
      <div>
        <div class="detail-date">${f.full}<span class="weekday">${weekdayZh(entry.date)}</span></div>
      </div>
      ${statsHtml}
      <div class="found-count">發現逆勢股 <b>${entry.count}</b> 檔</div>
    </div>
    ${bodyHtml}
  `;

  if (entry.stocks.length){
    main.querySelectorAll('.frame').forEach(a=>{
      a.addEventListener('click', (ev)=>{
        ev.preventDefault();
        const s = entry.stocks[a.dataset.idx];
        openLightbox(s, f.full);
      });
    });
  }
}

function openLightbox(stock, dateFull){
  const dlg = document.getElementById('lightbox');
  document.getElementById('lightboxImg').src = stock.img;
  document.getElementById('lightboxImg').alt = `${stock.code} ${stock.name} 近三年股價與大盤疊圖`;
  document.getElementById('lightboxCaption').textContent = `${stock.code} ${stock.name} · 近三年股價 vs. 加權指數（${dateFull} 重挫日）`;
  if (typeof dlg.showModal === 'function') dlg.showModal();
}
document.getElementById('lightboxClose').addEventListener('click', ()=> document.getElementById('lightbox').close());
document.getElementById('lightbox').addEventListener('click', (e)=>{
  if (e.target.id === 'lightbox') e.target.close();
});

let currentDate = null;
function selectDate(date){
  currentDate = date;
  const entry = DATA.find(e=>e.date===date);
  renderDetail(entry);
  buildRail(date);
  const row = document.querySelector(`.day-row[data-date="${date}"]`);
  if (row) row.scrollIntoView({block:'nearest'});
}

fetch('data.json')
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(data => {
    DATA = data.slice().sort((a,b) => b.date.localeCompare(a.date));
    const initial = DATA.find(e=>e.stocks.length) || DATA[0];
    selectDate(initial.date);
  })
  .catch(err => {
    document.getElementById('main').innerHTML =
      `<div class="load-state">資料載入失敗（${err.message}）。若你是用 file:// 直接開啟這個檔案，瀏覽器會擋掉本機 fetch——請改用本機伺服器（例如 <code>python3 -m http.server</code>）或直接透過 GitHub Pages 網址開啟。</div>`;
  });
</script>
</body>
</html>
