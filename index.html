<!doctype html><html lang="zh-Hant-TW"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="記錄台股大盤重挫日，以及當日逆勢個股的股價與加權指數疊圖。"><meta name="color-scheme" content="light dark"><title>逆勢日誌｜台股重挫日觀察</title>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-70EKPXQTBG"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date);gtag('config','G-70EKPXQTBG')</script>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#172033;--muted:#667085;--line:#dce1e8;--soft:#eef1f5;--brand:#243b64;--red:#c93636;--red-soft:#fae9e7;--shadow:0 12px 36px #17203314;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color-scheme:light}:root[data-theme=dark]{--bg:#10141c;--panel:#181e29;--ink:#eef2f7;--muted:#a1a9b8;--line:#303846;--soft:#222a37;--brand:#adc4ec;--red:#ff7770;--red-soft:#3d2528;--shadow:0 16px 40px #00000047;color-scheme:dark}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}button,input,select{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}:focus-visible{outline:3px solid #4f7ec9;outline-offset:2px}.num{font-variant-numeric:tabular-nums}.app{max-width:1480px;margin:auto;min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:24px 16px}.brand{padding:0 8px 22px;border-bottom:1px solid var(--line)}.brand h1{font-size:1.25rem;margin:0 0 4px;letter-spacing:.08em}.brand p{margin:0;color:var(--muted);font-size:.82rem}.years{padding-top:14px}.year{margin-bottom:7px}.year>button{width:100%;display:flex;justify-content:space-between;border:0;background:transparent;padding:8px;border-radius:7px;color:var(--muted);font-weight:700}.year>button:hover,.date-btn:hover{background:var(--soft)}.year.closed .dates{display:none}.year.closed .arrow{transform:rotate(-90deg)}.dates{display:grid;gap:2px}.date-btn{border:0;background:transparent;padding:8px 10px;border-radius:7px;display:flex;align-items:center;text-align:left}.date-btn[aria-current=true]{color:var(--brand);background:var(--soft);font-weight:700}.date-btn .count{margin-left:auto;color:var(--muted);font-size:.78rem}.dot{width:7px;height:7px;background:var(--red);border-radius:50%;margin-right:9px}
main{padding:28px clamp(18px,4vw,56px) 56px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;color:var(--muted);font-size:.88rem}.mobile-brand{display:none;font-weight:800;color:var(--ink);letter-spacing:.07em}.tools{margin-left:auto}.icon-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}.icon-btn:hover{background:var(--soft)}.summary{display:grid;grid-template-columns:minmax(220px,1.5fr) repeat(3,minmax(120px,.65fr));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:22px}.summary>div{padding:20px 22px;border-left:1px solid var(--line)}.summary>div:first-child{border-left:0}.eyebrow{font-size:.76rem;color:var(--muted);font-weight:700;letter-spacing:.08em;margin-bottom:5px}.date-title{margin:0;font-size:clamp(1.65rem,3vw,2.35rem);line-height:1.15;letter-spacing:-.03em}.weekday{font-size:.9rem;color:var(--muted);font-weight:500;margin-left:8px}.value{font-size:1.3rem;font-weight:760}.down,.status{color:var(--red)}
.controls{display:flex;align-items:center;gap:12px;margin-bottom:18px}.search{position:relative;flex:1;max-width:390px}.search input{width:100%;height:42px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:0 14px 0 40px}.search svg{position:absolute;left:13px;top:12px;color:var(--muted)}.result{margin-left:auto;color:var(--muted);font-size:.9rem}.result strong{color:var(--ink)}.mobile-select{display:none;width:100%;height:44px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr));gap:18px}.card{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 3px 16px #1720330d}.frame{display:block;width:100%;padding:0;border:0;background:#f8f8f7;cursor:zoom-in;aspect-ratio:12/5;overflow:hidden}.frame img{display:block;width:100%;height:100%;object-fit:contain;transition:transform .2s}.frame:hover img{transform:scale(1.012)}.meta{display:flex;align-items:center;gap:10px;padding:11px 14px}.ticker{font:700 .78rem ui-monospace,monospace;color:var(--red);background:var(--red-soft);border-radius:5px;padding:3px 7px}.name{font-weight:700}.empty{grid-column:1/-1;padding:60px 24px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted);background:var(--panel)}footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:.82rem;display:flex;gap:16px;flex-wrap:wrap}footer a{text-underline-offset:3px}
dialog{border:0;padding:0;background:transparent;width:min(1100px,94vw);max-width:none}dialog::backdrop{background:#04080ed1}.lightbox{background:#f8f8f7;border-radius:13px;padding:14px;position:relative}.lightbox img{display:block;width:100%}.close{position:absolute;right:10px;top:10px;width:40px;height:40px;border:0;border-radius:50%;background:#10141cd1;color:#fff}.caption{text-align:center;color:#475467;margin:10px 0 0;font-size:.88rem}
@media(max-width:820px){.app{display:block}.sidebar{display:none}main{padding:16px 14px 40px}.topbar{margin-bottom:14px}.mobile-brand,.mobile-select{display:block}.schedule{display:none}.summary{grid-template-columns:1fr 1fr;margin-bottom:14px}.summary>div{padding:15px}.summary .lead{grid-column:1/-1;border-left:0;border-bottom:1px solid var(--line)}.summary>div:nth-child(2){border-left:0}.summary>div:last-child{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.controls{flex-wrap:wrap}.search{max-width:none;flex-basis:100%}.result{margin-left:0}.grid{gap:12px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.frame img{transition:none}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><h1>逆勢日誌</h1><p>台股重挫日觀察</p></div><nav class="years" id="years" aria-label="重挫日期"></nav></aside><main><div class="topbar"><div class="mobile-brand">逆勢日誌</div><span class="schedule">每個交易日 18:00 自動檢查</span><div class="tools"><button class="icon-btn" id="theme" aria-label="切換深色模式" title="切換深色模式">◐</button></div></div><select class="mobile-select" id="dateSelect" aria-label="選擇重挫日期"></select><section id="content" aria-live="polite"><div class="empty">正在載入資料…</div></section><footer><span>資料僅供研究紀錄，不構成投資建議</span><span>來源：<a href="https://www.twse.com.tw/" target="_blank" rel="noopener">證交所</a>、<a href="https://concords.moneydj.com/z/zk/zk1/zkparse_580_30.djhtm" target="_blank" rel="noopener">MoneyDJ</a>、<a href="https://finmindtrade.com/" target="_blank" rel="noopener">FinMind</a></span></footer></main></div>
<dialog id="dialog"><div class="lightbox"><button class="close" aria-label="關閉圖片">✕</button><img id="largeImg" alt=""><p class="caption" id="caption"></p></div></dialog>
<script>
let data=[],current=null,query='';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),fmt=n=>Number(n).toLocaleString('zh-TW',{minimumFractionDigits:2,maximumFractionDigits:2}),weekday=d=>'星期'+['日','一','二','三','四','五','六'][new Date(d+'T00:00:00+08:00').getDay()];
function navigation(){const groups=data.reduce((a,e)=>((a[e.date.slice(0,4)]??=[]).push(e),a),{});$('#years').innerHTML=Object.entries(groups).sort(([a],[b])=>b.localeCompare(a)).map(([y,items],i)=>`<section class="year ${i?'closed':''}"><button aria-expanded="${!i}"><span>${y}</span><span class="arrow">⌄</span></button><div class="dates">${items.map(e=>`<button class="date-btn" data-date="${e.date}" aria-current="${e.date===current}"><span class="dot"></span><span class="num">${e.date.slice(5).replace('-',' / ')}</span><span class="count">${e.count} 檔</span></button>`).join('')}</div></section>`).join('');$('#dateSelect').innerHTML=data.map(e=>`<option value="${e.date}" ${e.date===current?'selected':''}>${e.date}　${e.count} 檔</option>`).join('');document.querySelectorAll('.year>button').forEach(b=>b.onclick=()=>{const s=b.parentElement;s.classList.toggle('closed');b.setAttribute('aria-expanded',!s.classList.contains('closed'))});document.querySelectorAll('.date-btn').forEach(b=>b.onclick=()=>select(b.dataset.date))}
function select(date){current=date;query='';history.replaceState(null,'','#'+date);navigation();render()}
function render(){const e=data.find(x=>x.date===current);if(!e)return;const stocks=e.stocks.filter(s=>(s.code+' '+s.name).toLowerCase().includes(query.toLowerCase())),stats=e.close!=null?`<div><div class="eyebrow">大盤收盤</div><div class="value num">${fmt(e.close)}</div></div><div><div class="eyebrow">當日跌幅</div><div class="value down num">▼ ${Number(e.dropPct).toFixed(2)}%</div></div>`:`<div><div class="eyebrow">大盤狀態</div><div class="value down">重挫 ≥ 1.5%</div></div>`;$('#content').innerHTML=`<section class="summary"><div class="lead"><div class="eyebrow">重挫日</div><h2 class="date-title num">${e.date.replaceAll('-','.')}<span class="weekday">${weekday(e.date)}</span></h2></div>${stats}<div><div class="eyebrow">逆勢個股</div><div class="value num">${e.count} 檔</div>${e.status==='partial'?'<small class="status">部分圖表待重試</small>':''}</div></section><div class="controls"><label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="2"/></svg><input id="search" type="search" placeholder="搜尋股票代號或名稱" value="${esc(query)}" aria-label="搜尋股票"></label><div class="result">顯示 <strong>${stocks.length}</strong> 檔</div></div><div class="grid">${stocks.length?stocks.map((s,i)=>`<figure class="card"><button class="frame" data-i="${i}" aria-label="放大檢視 ${esc(s.code)} ${esc(s.name)}"><img src="${esc(s.img)}" alt="${esc(s.code)} ${esc(s.name)} 股價與加權指數疊圖" loading="lazy" decoding="async"></button><figcaption class="meta"><span class="ticker">${esc(s.code)}</span><span class="name">${esc(s.name)}</span></figcaption></figure>`).join(''):`<div class="empty">${query?'找不到符合的股票':'這個日期尚無圖表'}</div>`}</div>`;$('#search').oninput=ev=>{query=ev.target.value;render();$('#search').focus();$('#search').setSelectionRange(query.length,query.length)};document.querySelectorAll('.frame').forEach(b=>b.onclick=()=>open(stocks[b.dataset.i],e.date))}
function open(s,d){$('#largeImg').src=s.img;$('#largeImg').alt=`${s.code} ${s.name} 股價與加權指數疊圖`;$('#caption').textContent=`${s.code} ${s.name} · ${d} 重挫日`;$('#dialog').showModal()}$('#dialog .close').onclick=()=>$('#dialog').close();$('#dialog').onclick=e=>{if(e.target===$('#dialog'))$('#dialog').close()};$('#dateSelect').onchange=e=>select(e.target.value);const saved=localStorage.getItem('theme');if(saved)document.documentElement.dataset.theme=saved;$('#theme').onclick=()=>{const d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'light':'dark';localStorage.setItem('theme',d?'light':'dark')};fetch('data.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(rows=>{data=rows.sort((a,b)=>b.date.localeCompare(a.date));const h=location.hash.slice(1);current=data.some(e=>e.date===h)?h:(data.find(e=>e.stocks.length)?.date||data[0]?.date);navigation();render()}).catch(()=>{$('#content').innerHTML='<div class="empty">資料暫時無法載入，請稍後再試。</div>'});
</script></body></html>
