<script>
let data=[],current=null,query='',view='day';try{if(localStorage.getItem('view')==='trend')view='trend'}catch{}const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),fmt=n=>Number(n).toLocaleString('zh-TW',{minimumFractionDigits:2,maximumFractionDigits:2}),weekday=d=>'星期'+['日','一','二','三','四','五','六'][new Date(d+'T00:00:00+08:00').getDay()];
const prices=new Map(),loadPrices=code=>{if(!prices.has(code))prices.set(code,fetch(`prices/${code}.json`).then(r=>r.ok?r.json():null).catch(()=>null));return prices.get(code)},px=v=>v==null?'—':v.toLocaleString('zh-TW',{maximumFractionDigits:v>=100?1:2}),ma=(a,n)=>{let s=0;return a.map((v,i)=>{s+=v;if(i>=n)s-=a[i-n];return i>=n-1?s/n:null})};
// 近一年收盤價 + MA20 + MA60 的 SVG 折線圖；均線用完整歷史計算，所以一年範圍的開頭就有值
function chart(p,crash){const n=p.dates.length;if(n<2)return null;const f=new Date(p.dates[n-1]+'T00:00:00Z');f.setUTCDate(f.getUTCDate()-365);const from=f.toISOString().slice(0,10),k=Math.max(0,p.dates.findIndex(d=>d>=from)),d=p.dates.slice(k),c=p.close.slice(k),a=ma(p.close,20).slice(k),b=ma(p.close,60).slice(k),v=[...c,...a,...b].filter(x=>x!=null),lo=Math.min(...v),hi=Math.max(...v),pad=(hi-lo)*.08||hi*.05||1,y0=lo-pad,y1=hi+pad,W=1200,H=500,L=12,R=104,T=20,B=46,X=i=>+(L+(W-L-R)*i/(d.length-1)).toFixed(1),Y=x=>+(T+(H-T-B)*(y1-x)/(y1-y0)).toFixed(1),line=(s,cls)=>`<path class="${cls}" d="${s.map((x,i)=>x==null?'':(s[i-1]==null?'M':'L')+X(i)+','+Y(x)).join('')}"/>`;
let g='';for(let j=0;j<5;j++){const x=lo+(hi-lo)*j/4;g+=`<line class="g" x1="${L}" x2="${W-R}" y1="${Y(x)}" y2="${Y(x)}"/><text class="t" x="${W-R+12}" y="${Y(x)+8}">${px(x)}</text>`}
for(let i=1;i<d.length;i++)if(d[i].slice(5,7)!==d[i-1].slice(5,7)){g+=`<line class="g" x1="${X(i)}" x2="${X(i)}" y1="${H-B}" y2="${H-B+8}"/>`;if(+d[i].slice(5,7)%2&&X(i)<W-R-30)g+=`<text class="t" x="${X(i)}" y="${H-10}" text-anchor="middle">${d[i].slice(2,4)}/${d[i].slice(5,7)}</text>`}
const ci=crash>=d[0]?d.findIndex(x=>x>=crash):-1;g+=ci<0?`<text class="t" x="${L+8}" y="${T+22}">重挫日 ${crash} 不在近一年範圍內</text>`:`<line class="x" x1="${X(ci)}" x2="${X(ci)}" y1="${T}" y2="${H-B}"/><text class="xt" x="${X(ci)+(X(ci)>W/2?-10:10)}" y="${T+22}" text-anchor="${X(ci)>W/2?'end':'start'}">重挫日</text>`;

function drawChart(el,code,date,legend){loadPrices(code).then(p=>{const c=p&&chart(p,date);el.innerHTML=c?c.svg:'尚無近一年資料';if(legend)legend.innerHTML=c?c.legend:''})}
function setView(v){view=v;try{localStorage.setItem('view',v)}catch{}document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-checked',b.dataset.view===view));$('#viewSelect').value=view;render()}

function open(s,d){const t=view==='trend';$('.lightbox').classList.toggle('trend',t);$('#largeImg').hidden=t;$('#largeChart').hidden=!t;if(t){$('#largeChart').innerHTML='載入中…';drawChart($('#largeChart'),s.code,d)}else{$('#largeImg').src=s.img;$('#largeImg').alt=`${s.code} ${s.name} 股價與加權指數疊圖`}$('#caption').textContent=`${s.code} ${s.name} · ${t?'近一年股價（MA20／MA60）· ':''}${d} 重挫日`;$('#dialog').showModal()}document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('#viewSelect').onchange=e=>setView(e.target.value);setView(view);$('#dialog .close').onclick=()=>$('#dialog').close();$('#dialog').onclick=e=>{if(e.target===$('#dialog'))$('#dialog').close()};$('#dateSelect').onchange=e=>select(e.target.value);const saved=localStorage.getItem('theme');if(saved)document.documentElement.dataset.theme=saved;$('#theme').onclick=()=>{const d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'light':'dark';localStorage.setItem('theme',d?'light':'dark')};fetch('data.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(rows=>{data=rows.sort((a,b)=>b.date.localeCompare(a.date));const h=location.hash.slice(1);current=data.some(e=>e.date===h)?h:(data.find(e=>e.stocks.length)?.date||data[0]?.date);navigation();render()}).catch(()=>{$('#content').innerHTML='<div class="empty">資料暫時無法載入，請稍後再試。</div>'});
